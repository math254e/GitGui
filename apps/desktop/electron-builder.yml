appId: dev.gitgui.desktop
productName: GitGui
artifactName: GitGui-${version}-${os}-${arch}.${ext}
# package-desktop.mjs overrides these with absolute, isolated staging paths.
directories:
  output: release
  buildResources: apps/desktop/build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: apps/web/build
    to: web
  - from: apps/desktop/resources/server
    to: server
publish:
  provider: github
  owner: math254e
  repo: GitGui
  channel: latest
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: icon.ico
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  differentialPackage: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  executableName: gitgui
  icon: icon.png
  category: Development
asar: true
npmRebuild: false
